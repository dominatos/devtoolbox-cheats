name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  # ─── Security ───────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Bash Syntax ────────────────────────────────────────────
  bash-syntax:
    name: Bash Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check bash syntax on all .sh files
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "FAIL: $f"
              failed=1
            else
              echo "OK:   $f"
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -not -path './Windows-beta/*' -print0)
          exit $failed

  # ─── Shell Lint ─────────────────────────────────────────────
  shell-lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on all .sh files
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if shellcheck -e SC1091 -e SC2034 -e SC2155 -e SC2169 -e SC3043 -e SC3010 -e SC2086 -e SC2046 -e SC2001 -e SC2002 -e SC2005 -e SC2012 -e SC2015 -e SC2028 -e SC2043 -e SC2116 -e SC2128 -e SC2143 -e SC2162 -e SC2181 -e SC2191 -e SC2206 -e SC2207 -e SC2230 -e SC2236 -e SC2064 -e SC2068 -e SC2069 -e SC2066 -e SC2059 -e SC2050 -e SC2048 -e SC2013 -e SC2027 -e SC2010 -e SC2004 "$f"; then
              echo "OK:   $f"
            else
              echo "FAIL: $f"
              failed=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -not -path './Windows-beta/*' -print0)
          exit $failed

  # ─── QML Syntax ─────────────────────────────────────────────
  qml-syntax:
    name: QML Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Qt QML toolchain
        run: sudo apt-get update && sudo apt-get install -y qtdeclarative5-dev-tools

      - name: Validate QML files
        run: |
          failed=0
          # Detect Qt5 linter (plasma6 widget files are skipped — see loop below)
          if [ -x /usr/lib/qt5/bin/qmllint ]; then
             LINT5_CMD="/usr/lib/qt5/bin/qmllint"
          elif command -v qmllint >/dev/null; then
             LINT5_CMD="qmllint"
          elif command -v qml-lint >/dev/null; then
             LINT5_CMD="qml-lint"
          else
             echo "FAIL: No Qt5 QML linter found."
             exit 1
          fi

          qml_list=$(mktemp)
          trap 'rm -f "$qml_list"' EXIT
          if ! find . -name '*.qml' -not -path './.git/*' -print0 > "$qml_list"; then
            echo "FAIL: find returned an error while scanning for QML files"
            exit 1
          fi
          while IFS= read -r -d '' f; do
            if [[ "$f" == *kde-widget-plasma6* ]]; then
              # Skip: qmllint6 cannot resolve KDE Plasma 6 QML module types
              # (org.kde.plasma.*, PlasmoidItem) without a full KDE runtime.
              # These files are validated manually on the target KDE Plasma 6 desktop.
              echo "SKIP: $f — KDE Plasma 6 modules not available in CI"
              continue
            fi
            if ! "$LINT5_CMD" "$f" >/dev/null 2>&1; then
              echo "FAIL: $f — qmllint error"
              "$LINT5_CMD" "$f" || true
              failed=1
            else
              echo "OK:   $f"
            fi
          done < "$qml_list"
          rm -f "$qml_list"
          exit $failed

  # ─── Markdown Lint ──────────────────────────────────────────
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Layer 1: Fast shell-based checks
      - name: Validate Markdown front-matter
        run: |
          # Cheatsheets use bare "Key: Value" front-matter (no --- delimiters)
          # Parser reads Title/Group/Icon/Order from first 80 lines
          failed=0
          while IFS= read -r -d '' f; do
            # Check Title field exists in first 5 lines
            if ! head -n 5 "$f" | grep -qi '^Title:'; then
              echo "FAIL: $f — missing 'Title' in front-matter"
              failed=1
            fi
            # Check for trailing whitespace
            if grep -Pn '[ \t]+$' "$f" > /dev/null 2>&1; then
              echo "FAIL: $f — trailing whitespace found"
              failed=1
            fi
          done < <(find cheats.d -name '*.md' -not -path './.git/*' 2>/dev/null -print0)
          exit $failed

      - name: Validate Markdown links
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            # Check for broken local links (not http/https)
            while IFS= read -r link; do
              # Extract the URL part: sed removes everything before the last (, and the trailing )
              target=$(echo "$link" | sed -E 's/^\[.*\]\((.*)\)$/\1/' | sed -E "s/ [\"'].*[\"']$//")
              # Skip http/https links, mailto, and anchors
              if [[ "$target" == http* ]] || [[ "$target" == mailto:* ]] || [[ "$target" == \#* ]]; then
                continue
              fi
              # Skip false positives like regex patterns ['"]([^'"]+)
              if [[ "$target" == *^* ]] || [[ "$target" == *\\* ]] || [[ "$target" == *\{* ]]; then
                continue
              fi
              # Strip anchor from file#anchor
              file_target="${target%%#*}"
              # Resolution order: try repository-root first, then document-relative.
              # Non-rooted paths (no leading /) resolve from the repo root before falling
              # back to the source document's directory. This means a bare "foo.md" will
              # match ./foo.md at the repo root even if it doesn't exist next to the source.
              if [ -n "$file_target" ] && [ ! -f "$file_target" ] && [ ! -d "$file_target" ] && [ ! -f "$(dirname "$f")/$file_target" ] && [ ! -d "$(dirname "$f")/$file_target" ]; then
                echo "FAIL: $f — broken local link: $target"
                failed=1
              fi
            done < <(grep -oP '\[.*?\]\((.*?)\)' "$f" 2>/dev/null || true)
          done < <(find . -name '*.md' -not -path './.git/*' -not -path './Windows-beta/*' -not -path './.mimocode/*' -not -path './docs/compose/*' -print0)
          echo "Local link check complete"
          exit $failed

      - name: Validate README structure
        run: |
          # Check required sections exist
          sections=("Features" "Requirements" "Installation" "License")
          failed=0
          for s in "${sections[@]}"; do
            if ! grep -qi "## .*${s}" README.md; then
              echo "FAIL: README.md missing '## $s' section"
              failed=1
            fi
          done
          # Check CHANGELOG has version entries (## vX.Y.Z format)
          if ! grep -qP '## v\d+\.\d+\.\d+' CHANGELOG.md; then
            echo "FAIL: CHANGELOG.md missing version entries"
            failed=1
          fi
          exit $failed

      # Layer 2: markdownlint-cli2 for deep analysis
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 '**/*.md' '!Windows-beta/**' '!.mimocode/**' '!.codex/**' '!docs/compose/**'

  # ─── File Integrity ─────────────────────────────────────────
  integrity:
    name: File Integrity
    runs-on: ubuntu-latest
    needs: bash-syntax
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify required files exist
        run: |
          required_files=(
            "version.txt"
            "README.md"
            "CHANGELOG.md"
            "LICENSE"
            "install.sh"
            "devtoolbox-cheats.30s.sh"
            "cheats-updater.sh"
            ".github/workflows/ci.yml"
            ".github/dependabot.yml"
          )
          failed=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "FAIL: Missing required file: $f"
              failed=1
            else
              echo "OK:   $f"
            fi
          done
          exit $failed

      - name: Check .env is not committed
        run: |
          if [ -f ".env" ]; then
            echo "FAIL: .env file should not be in repo"
            exit 1
          fi
          echo "OK: No .env in repo"

      - name: Check for large files
        run: |
          find . -type f -size +1M -not -path './.git/*' -not -path './Windows-beta/*' -not -path './__pycache__/*' -print0 | while IFS= read -r -d '' f; do
            size=$(du -h "$f" | cut -f1)
            echo "WARN: Large file: $f ($size)"
          done
          echo "Large file check complete"

  # ─── macOS Port Tests ───────────────────────────────────────
  macos-port:
    name: macOS Port Tests
    runs-on: macos-latest
    needs: bash-syntax
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Bash 4+ (scripts auto-re-exec into it)
        run: |
          if ! /opt/homebrew/bin/bash --version >/dev/null 2>&1 \
             && ! /usr/local/bin/bash --version >/dev/null 2>&1; then
            brew install bash
          fi

      - name: Verify macOS scripts are standalone (no Linux source / compat.sh)
        run: |
          failed=0
          for f in macOS-beta/*.sh; do
            # Detect bash `source` and POSIX `. ` dot-sourcing of Linux
            # scripts or the removed compat.sh shim.
            if grep -nE '(source|\.)[[:space:]]+.*(compat\.sh|\.\./)' "$f"; then
              echo "FAIL: $f sources a Linux script or compat.sh"
              failed=1
            else
              echo "OK:   $f is standalone"
            fi
          done
          exit $failed

      - name: Run macOS installer tests
        run: bash tests/test_macos_install.sh

      - name: Run macOS updater tests
        run: bash tests/test_macos_cheats_updater.sh

  # ─── Version Sync ───────────────────────────────────────────
  version-sync:
    name: Version Sync
    runs-on: ubuntu-latest
    needs: bash-syntax
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify version consistency
        run: |
          txt_version=$(cat version.txt | tr -d '[:space:]')
          echo "version.txt: $txt_version"
          failed=0

          # Scripts use VERSION="v1.4.39" (with v prefix), strip it for comparison
          for script in devtoolbox-cheats.30s.sh cheats-updater.sh install.sh devtools.1m.sh generate-tldr.sh \
                        macOS-beta/devtoolbox-cheats.30s.sh macOS-beta/cheats-updater.sh macOS-beta/install.sh \
                        macOS-beta/devtools.1m.sh macOS-beta/generate-tldr.sh; do
            if [ ! -f "$script" ]; then
              echo "FAIL: missing versioned script: $script"
              failed=1
              continue
            fi
            script_version=$(grep -oP '(?<=VERSION=)["\047]?v?\K[^\s"\047]+' "$script" 2>/dev/null || true)
            if [ -z "$script_version" ]; then
              echo "FAIL: $script has no non-empty VERSION"
              failed=1
            elif [ "$txt_version" != "$script_version" ]; then
              echo "FAIL: $script version ($script_version) != version.txt ($txt_version)"
              failed=1
            else
              echo "OK:   $script = $script_version"
            fi
          done

          # KDE metadata uses bare version (no v prefix)
          for meta in kde-widget-plasma6/DevToolboxPlasmoid/metadata.json kde-widget-plasma5/DevToolboxPlasmoid/metadata.json; do
            if [ -f "$meta" ]; then
              meta_version=$(grep -oP '"Version"\s*:\s*"\K[^"]+' "$meta" 2>/dev/null || true)
              if [ -n "$meta_version" ]; then
                if [ "$txt_version" != "$meta_version" ]; then
                  echo "FAIL: $meta version ($meta_version) != version.txt ($txt_version)"
                  failed=1
                else
                  echo "OK:   $meta = $meta_version"
                fi
              fi
            fi
          done

          exit $failed
